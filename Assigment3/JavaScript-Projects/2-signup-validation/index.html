<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Form Validation</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Create an Account</h1>
    <form id="signup-form" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required minlength="2">
      <small class="error" id="name-error"></small>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <small class="error" id="email-error"></small>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
      <small class="hint">Use at least 8 characters, including a letter and a number.</small>
      <small class="error" id="password-error"></small>

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required>
      <small class="error" id="confirm-error"></small>

      <button type="submit">Sign Up</button>
      <p id="success" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
