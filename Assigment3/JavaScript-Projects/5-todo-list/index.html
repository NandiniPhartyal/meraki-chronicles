<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Todo List</h1>
    <form id="todo-form">
      <label class="visually-hidden" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="Enter a task..." maxlength="120" required>
      <button type="submit">Add</button>
    </form>
    <p id="task-count">0 tasks remaining</p>
    <ul id="task-list"></ul>
  </main>
</body>
</html>
